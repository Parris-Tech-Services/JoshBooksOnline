# Tool settings only; ruizu-episodes is installed on the phone by install.sh, not by pip.
[project]
name = "ruizu-episodes"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []  # standard library only; needs ffmpeg, ffprobe and curl on PATH

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["ruizu_episodes"]
