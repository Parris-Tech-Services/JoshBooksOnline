plugins { id 'com.android.application' }

android {
    namespace 'au.com.parristech.ruizusync'
    compileSdk 35

    defaultConfig {
        applicationId 'au.com.parristech.ruizusync'
        minSdk 26
        // targetSdk 35: Android 15 enforces edge-to-edge, so MainActivity applies window insets.
        targetSdk 35
        versionCode 5
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('RELEASE_KEYSTORE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Pure-Java LAME port: MP3 encoding without native code or NDK.
    implementation files('libs/jump3r-1.0.5.jar')
    testImplementation 'junit:junit:4.13.2'
}
