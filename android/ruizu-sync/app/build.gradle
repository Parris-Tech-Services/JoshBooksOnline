plugins { id 'com.android.application' }

android {
    namespace 'au.com.parristech.ruizusync'
    compileSdk 35

    defaultConfig {
        applicationId 'au.com.parristech.ruizusync'
        minSdk 26
        // targetSdk 35: Android 15 enforces edge-to-edge, so MainActivity applies window insets.
        targetSdk 35
        // versionCode must increase for every published build: Android only performs an
        // in-place update (keeping app data and persisted SAF permissions) when the new
        // APK has the same package, the same signing certificate and a higher versionCode.
        versionCode 12
        versionName '1.2.8'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Dedicated release key is injected only by trusted CI secrets.
    // Never commit the keystore or hardcode its password in this repository.
    signingConfigs {
        release {
            def keystorePath = System.getenv('RELEASE_KEYSTORE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    // Main's isolated fake-USB provider remains test-only, not part of the debug APK.
    buildTypes {
        // Canonical identity: the release APK ships as the default applicationId
        // (au.com.parristech.ruizusync), which is the identity already installed and verified
        // on the Galaxy A55. Its certificate SHA-256 matches the project release key
        // d16afeee87dd25be0421223d748ab175cbb37b4c5152042933342cc5880307b4, so raising
        // versionCode upgrades it in place and preserves saved settings and SAF grants.
        // Do not reintroduce an applicationIdSuffix here: a new package would install as a
        // second app and silently orphan the user's existing data and permissions.
        release {
            minifyEnabled false
            debuggable false
            if (System.getenv('RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
        safTest {
            initWith debug
            applicationIdSuffix '.saftest'
            matchingFallbacks = ['debug']
        }
    }
    testBuildType 'safTest'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Pure-Java LAME port: MP3 encoding without native code or NDK.
    implementation files('libs/jump3r-1.0.5.jar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Bundle both native executables in the canonical APK. Legacy extraction is required for
// ProcessBuilder to execute these packaged PIE binaries from ApplicationInfo.nativeLibraryDir.
def episodeNative = layout.buildDirectory.dir('generated/episodeNative')
def episodeAssets = layout.buildDirectory.dir('generated/episodeAssets')
def episodeCodecScript = rootProject.file('tools/build-episode-codec.sh')
android.sourceSets.main.jniLibs.srcDir(episodeNative)
android.sourceSets.main.assets.srcDir(episodeAssets)
android.packaging.jniLibs.useLegacyPackaging = true
android.packaging.jniLibs.keepDebugSymbols.add('**/libruizu_ff*.so')

def buildEpisodeCodec = tasks.register('buildEpisodeCodec', Exec) {
    inputs.file(episodeCodecScript)
    outputs.dir(episodeNative)
    outputs.dir(episodeAssets)
    commandLine 'bash', episodeCodecScript.absolutePath, episodeNative.get().asFile.absolutePath,
            episodeAssets.get().asFile.absolutePath, layout.buildDirectory.dir('episode-codec-cache').get().asFile.absolutePath
}
tasks.configureEach { task ->
    if (task.name.matches('merge.*(JniLibFolders|NativeLibs|Assets)') ||
            task.name.toLowerCase(java.util.Locale.ROOT).contains('lint')) {
        task.dependsOn(buildEpisodeCodec)
    }
}
