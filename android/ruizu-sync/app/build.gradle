plugins { id 'com.android.application' }

android {
    namespace 'au.com.parristech.ruizusync'
    compileSdk 35

    defaultConfig {
        applicationId 'au.com.parristech.ruizusync'
        minSdk 26
        // targetSdk 34 keeps the framework's legacy layout behaviour; edge-to-edge enforcement
        // in Android 15 (targetSdk 35) would draw the UI under the system bars.
        targetSdk 34
        versionCode 2
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
