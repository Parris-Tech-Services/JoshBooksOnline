name: Playback Remote APK

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths: ["android/playback-remote/**", ".github/workflows/playback-remote-apk.yml"]
  pull_request:
    paths: ["android/playback-remote/**", ".github/workflows/playback-remote-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Playback Remote APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Signed with the same project release key as RUIZU Sync so it installs without the
      # debug-certificate Play Protect warning, and is not debuggable.
      - name: Build release APK
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/.keys/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RUIZU_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RUIZU_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RUIZU_RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RUIZU_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .keys
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing release signing key" >&2; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE"
          chmod 600 "$RELEASE_KEYSTORE"
          gradle --no-daemon -p android/playback-remote :app:assembleRelease
          ls -l android/playback-remote/app/build/outputs/apk/release/

      - name: Verify signature and manifest
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          export PATH="$SDK/build-tools/35.0.0:$SDK/platform-tools:$PATH"
          APK=android/playback-remote/app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose --print-certs "$APK" | head -12
          aapt2 dump badging "$APK" | grep -E "^package:|^launchable-activity:" 
          if aapt2 dump badging "$APK" | grep -q 'application-debuggable'; then
            echo "APK must not be debuggable" >&2; exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-remote-apk
          path: android/playback-remote/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
