name: Resolve JoshBooks publisher feeds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-publisher-podcast-feeds.yml'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact book episodes from official feeds
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,xml.etree.ElementTree as ET,time
          from pathlib import Path
          base=json.loads(Path('research/offline-podcast-sources.json').read_text())
          UA={'User-Agent':'JoshBooks-offline-audit/1.0'}
          known={
            'What Should I Read Next?':'https://rss.pdrl.fm/009d1c/feeds.megaphone.fm/ARML2867767043',
            "The Queen's Reading Room Podcast":'https://feeds.acast.com/public/shows/657b2f7238c1840016eba096',
            'A Good Read':'https://podcasts.files.bbci.co.uk/b006v8jn.rss',
            'Front Row':'https://podcasts.files.bbci.co.uk/b006qsq5.rss',
            'Strong Women':'https://strongwomen.libsyn.com/rss',
            'Backlisted':'https://feeds.megaphone.fm/GLT2438307082',
          }
          def get(url):
            return urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=35).read()
          def norm(s): return re.sub(r'[^a-z0-9]+',' ',(s or '').lower()).strip()
          def toks(s): return set(norm(s).split())
          def score(a,b):
            A,B=toks(a),toks(b)
            return len(A&B)/max(1,max(len(A),len(B)))
          # Discover the official NYT Book Review feed via Apple show search.
          for country in ['US','AU']:
            try:
              u='https://itunes.apple.com/search?term='+urllib.parse.quote('The Book Review New York Times')+'&media=podcast&entity=podcast&limit=20&country='+country
              data=json.loads(get(u).decode())
              for x in data.get('results',[]):
                name=x.get('collectionName') or x.get('trackName') or ''
                if x.get('feedUrl') and 'book review' in name.lower() and ('new york' in (x.get('artistName') or '').lower() or name.lower()=='the book review'):
                  known['The Book Review']=x['feedUrl']; known['The Book Review / The Interview']=x['feedUrl']
                  print('NYT_FEED',x['feedUrl'],name,x.get('artistName'))
                  raise StopIteration
            except StopIteration: break
            except Exception as e: print('NYT_SEARCH_ERROR',repr(e))
            time.sleep(1)
          caches={}
          for show,feed in known.items():
            if feed in caches: continue
            try:
              root=ET.fromstring(get(feed)); items=[]
              for it in root.findall('.//item'):
                title=(it.findtext('title') or '').strip(); enc=it.find('enclosure')
                if enc is not None and enc.attrib.get('url'):
                  items.append({'title':title,'audio':enc.attrib['url'],'length':enc.attrib.get('length'),'type':enc.attrib.get('type'),'guid':(it.findtext('guid') or '').strip()})
              caches[feed]=items
              print('FEED',show,feed,'items',len(items))
            except Exception as e: print('FEED_ERROR',show,feed,repr(e)); caches[feed]=[]
          resolved={}; unresolved=[]
          for e in base['results']:
            feed=known.get(e['show']); items=caches.get(feed,[]) if feed else []
            ranked=sorted(items,key=lambda x:score(e['title'],x['title']),reverse=True)
            if not ranked:
              unresolved.append({'id':e['id'],'title':e['title'],'show':e['show'],'reason':'no feed/items'}); continue
            best=ranked[0]; s=score(e['title'],best['title'])
            # Exact publisher feed is authoritative, but require strong title overlap to avoid same-show collisions.
            if s>=.55 or norm(e['title']) in norm(best['title']) or norm(best['title']) in norm(e['title']):
              resolved[e['id']]={'id':e['id'],'title':e['title'],'show':e['show'],'matchedTitle':best['title'],'audio':best['audio'],'feed':feed,'titleScore':round(s,3),'length':best['length'],'mime':best['type'],'guid':best['guid']}
              print('RESOLVED',json.dumps(resolved[e['id']],ensure_ascii=False))
            else:
              unresolved.append({'id':e['id'],'title':e['title'],'show':e['show'],'best':best['title'],'score':round(s,3),'feed':feed})
              print('UNRESOLVED',json.dumps(unresolved[-1],ensure_ascii=False))
          out={'generatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'total':len(base['results']),'resolvedCount':len(resolved),'map':resolved,'unresolved':unresolved,'feeds':known}
          Path('research/offline-podcast-sources-resolved.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print('SUMMARY',json.dumps({'total':out['total'],'resolved':out['resolvedCount'],'unresolved':len(unresolved)}))
          PY
      - name: Commit resolved map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/offline-podcast-sources-resolved.json
          git diff --cached --quiet && exit 0
          git commit -m "research: resolve book podcasts from publisher feeds"
          git push
