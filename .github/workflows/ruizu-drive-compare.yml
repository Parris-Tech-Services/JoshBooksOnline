name: RUIZU Drive Comparator

on:
  pull_request:
    paths:
      - 'tools/ruizu-drive-compare/**'
      - '.github/workflows/ruizu-drive-compare.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ruizu-drive-compare/**'
      - '.github/workflows/ruizu-drive-compare.yml'

permissions:
  contents: read

jobs:
  python-tests:
    name: Read-only comparator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile tools/ruizu-drive-compare/compare.py tools/ruizu-drive-compare/test_compare.py
      - name: Install FFmpeg for local movie-conversion smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Run unit tests (no personal Drive data)
        working-directory: tools/ruizu-drive-compare
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify sorter and video-converter syntax
        run: python -m py_compile tools/ruizu-drive-compare/sort_player.py tools/ruizu-drive-compare/test_sort_player.py tools/ruizu-drive-compare/prepare_video.py tools/ruizu-drive-compare/test_prepare_video.py tools/ruizu-drive-compare/one_movie.py tools/ruizu-drive-compare/test_one_movie.py

  offline-browser-tests:
    name: Offline browser comparison tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No private catalogues or network required
        run: node --test tools/ruizu-drive-compare/test_offline_review.mjs
