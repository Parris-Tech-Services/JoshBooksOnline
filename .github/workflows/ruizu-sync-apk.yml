name: RUIZU Sync Android APK

on:
  push:
    branches: [main, "feature/ruizu-sync-*"]
    paths: ["android/ruizu-sync/**", ".github/workflows/ruizu-sync-apk.yml"]
  pull_request:
    paths: ["android/ruizu-sync/**", ".github/workflows/ruizu-sync-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preserve development signing identity when cache is available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ruizu-development-signing-v1
      - name: Unit tests, Android lint and debug APK
        run: android/ruizu-sync/gradlew --no-daemon -p android/ruizu-sync :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Static APK verification
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          cd android/ruizu-sync
          bash tools/verify.sh app/build/outputs/apk/debug/app-debug.apk
      - name: APK checksum and signing certificate
        run: |
          cd android/ruizu-sync/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app-debug.apk > signing-certificate.txt
      - name: Test and lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruizu-test-reports
          path: |
            android/ruizu-sync/app/build/reports/
            android/ruizu-sync/app/build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ruizu-sync-debug-apk
          path: android/ruizu-sync/app/build/outputs/apk/debug/*
          retention-days: 90
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SAF fault injection and A55-sized UI on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 450
            android/ruizu-sync/gradlew --no-daemon -p android/ruizu-sync :app:connectedDebugAndroidTest
            adb pull /sdcard/Android/data/au.com.parristech.ruizusync.test/files/ruizu-ui.png ruizu-ui.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruizu-emulator-results
          path: |
            android/ruizu-sync/app/build/reports/androidTests/
            android/ruizu-sync/app/build/outputs/androidTest-results/
            ruizu-ui.png

  joshbooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage --runInBand
      - run: npm run build
      - run: node scripts/crap4all-typescript.mjs
