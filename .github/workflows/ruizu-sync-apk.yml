name: RUIZU Sync Android APK

on:
  push:
    branches: [main, "feature/ruizu-sync-*"]
    paths: ["android/ruizu-sync/**", ".github/workflows/ruizu-sync-apk.yml", ".github/scripts/emulator-smoke.sh"]
  pull_request:
    paths: ["android/ruizu-sync/**", ".github/workflows/ruizu-sync-apk.yml", ".github/scripts/emulator-smoke.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JVM tests, APK build and static verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # One Gradle invocation: tests and APK share the same compilation, which is faster
      # than two separate builds and still fails the gate when a test fails.
      - name: Unit tests and debug APK
        run: gradle --no-daemon -p android/ruizu-sync :app:testDebugUnitTest :app:assembleDebug

      - name: Build signed stable release APK
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/.keys/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RUIZU_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RUIZU_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RUIZU_RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RUIZU_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .keys
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing dedicated release signing key" >&2; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE"
          chmod 600 "$RELEASE_KEYSTORE"
          gradle --no-daemon -p android/ruizu-sync :app:assembleRelease
          test -s android/ruizu-sync/app/build/outputs/apk/release/app-release.apk

      - name: Static APK verification
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          export PATH="$SDK/build-tools/35.0.0:$SDK/platform-tools:$PATH"
          cd android/ruizu-sync
          bash ./tools/verify.sh app/build/outputs/apk/debug/app-debug.apk
          bash ./tools/verify.sh app/build/outputs/apk/release/app-release.apk au.com.parristech.ruizusync
          if aapt2 dump badging app/build/outputs/apk/release/app-release.apk | grep -q 'application-debuggable'; then
            echo 'ERROR: Signed stable APK is debuggable' >&2; exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruizu-sync-debug-apk
          path: android/ruizu-sync/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed stable installer
        uses: actions/upload-artifact@v4
        with:
          name: ruizu-sync-stable-signed-apk
          path: android/ruizu-sync/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator:
    name: Emulator smoke test (API 34)
    needs: build
    # Non-blocking on purpose: the APK is built and statically verified by the `build` job,
    # and emulator boot time on shared runners is variable. A failure here is reported as a
    # warning (and its screenshot/crash evidence still uploads) instead of hiding a good APK.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Emulator host check and KVM access
        run: |
          echo "kvm: $(ls -l /dev/kvm 2>&1 || echo missing)"
          grep -c -E '(vmx|svm)' /proc/cpuinfo || true
          free -m || true
          # The runner user is not always in the kvm group; without this the emulator
          # silently falls back to software emulation and never boots in time.
          sudo chmod 666 /dev/kvm || true

      - uses: actions/download-artifact@v4
        with:
          name: ruizu-sync-stable-signed-apk
          path: apk

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 256
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/emulator-smoke.sh apk/app-release.apk au.com.parristech.ruizusync


      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruizu-sync-emulator-evidence
          path: |
            emulator-launch.png
            window.xml
            window-scrolled.xml
          if-no-files-found: warn

  # The androidx instrumentation suites (TransferManagerTest, SafTransferTest,
  # DestinationAccessTest, MainActivityTest) were committed but never executed: the only
  # CI path was testDebugUnitTest plus a shell smoke test. This job runs them on a real
  # emulator against the safTest build type, whose test-only FakeUsbProvider supplies a
  # DocumentsProvider so SAF transfer paths are exercised with no physical USB hardware.
  instrumentation:
    name: Android instrumentation tests (SAF fake provider)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Emulator host check and KVM access
        run: |
          echo "kvm: $(ls -l /dev/kvm 2>&1 || echo missing)"
          sudo chmod 666 /dev/kvm || true

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 256
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -o pipefail
            # testBuildType is 'safTest', so this runs the safTest variant (package .saftest)
            # and installs both the app and its androidTest APK on the emulator.
            gradle --no-daemon -p android/ruizu-sync :app:connectedAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruizu-sync-instrumentation-reports
          path: |
            android/ruizu-sync/app/build/reports/androidTests/**
            android/ruizu-sync/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
