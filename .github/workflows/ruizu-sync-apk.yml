name: RUIZU Sync Android APK

on:
  push:
    branches: [main, "feature/ruizu-sync-*"]
    paths: ["android/ruizu-sync/**", ".github/workflows/ruizu-sync-apk.yml"]
  pull_request:
    paths: ["android/ruizu-sync/**", ".github/workflows/ruizu-sync-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and debug APK
        run: gradle --no-daemon -p android/ruizu-sync :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ruizu-sync-debug-apk
          path: android/ruizu-sync/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
